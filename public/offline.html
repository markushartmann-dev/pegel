<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Pegel</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f7f9; --fg: #0f1720; --muted: #5b6673; --card: #fff; --border: #dde2e8; --primary: #0e7490; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1014; --fg: #e6edf3; --muted: #93a1b0; --card: #151a20; --border: #26303a; --primary: #22d3ee; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
      main { max-width: 420px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: var(--muted); line-height: 1.5; }
      a { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px; background: var(--primary); color: var(--bg); text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Keine Verbindung</h1>
      <p>Pegel benötigt eine Verbindung zum Server. Deine Daten werden aus Datenschutzgründen nicht auf dem Gerät zwischengespeichert.</p>
      <a href="/dashboard">Erneut versuchen</a>
    </main>
  </body>
</html>
