# Pegel – Produktionsbetrieb
#   docker compose up -d --build
# Vorher: .env aus .env.example anlegen und AUTH_SECRET sowie POSTGRES_PASSWORD setzen (siehe README).
name: pegel

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pegel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-pegel}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Persistente Datenbank (Bind-Mount, damit Hyper Backup den Ordner sichern kann)
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]
    mem_limit: 512m
    logging: *logging

  # Kontrollierter Migrationsschritt: läuft vor jedem App-Start einmal und beendet sich danach.
  migrate:
    build:
      context: .
      target: migrator
    image: pegel-migrate:local
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pegel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pegel}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    mem_limit: 512m
    logging: *logging

  app:
    build:
      context: .
      target: runner
    image: pegel:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-1717}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pegel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pegel}
      APP_URL: ${APP_URL:?APP_URL in .env setzen}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET in .env setzen}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-30}
      SESSION_UPDATE_AGE_HOURS: ${SESSION_UPDATE_AGE_HOURS:-24}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Berlin}
      MODEL_BETA_PER_HOUR: ${MODEL_BETA_PER_HOUR:-0.15}
      MODEL_ABSORPTION_MINUTES: ${MODEL_ABSORPTION_MINUTES:-30}
      SAVINGS_PER_DAY: ${SAVINGS_PER_DAY:-5}
      SAVINGS_WEEK_BONUS: ${SAVINGS_WEEK_BONUS:-10}
      SAVINGS_MONTH_BONUS: ${SAVINGS_MONTH_BONUS:-20}
      IMPRINT_NAME: ${IMPRINT_NAME:-}
      IMPRINT_STREET: ${IMPRINT_STREET:-}
      IMPRINT_CITY: ${IMPRINT_CITY:-}
      IMPRINT_COUNTRY: ${IMPRINT_COUNTRY:-}
      IMPRINT_EMAIL: ${IMPRINT_EMAIL:-}
      IMPRINT_PHONE: ${IMPRINT_PHONE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      TZ: ${TZ:-Europe/Berlin}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [internal, web]
    mem_limit: 768m
    logging: *logging

networks:
  # Datenbank ist nur intern erreichbar (kein Port nach außen)
  internal:
    internal: true
  # App braucht ausgehenden Zugriff für optionale E-Mails und Push
  web: {}
